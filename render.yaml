services:
  - type: web
    name: resync-backend
    env: docker
    dockerfilePath: ./Dockerfile
    # Render's 100s proxy timeout is handled at the application layer:
    # POST /api/scans/start + GET /api/scans/{id} polling (see main.py).
    envVars:
      - key: PORT
        value: "8000"
      - key: GEMINI_API_KEY
        sync: false
      # ponytail: capstone-testing kill switch -- credit_wallet/credit_ledger
      # lack service_role GRANTs (migrations/004_credits.sql never added them).
      # Flip to "true" (or remove) once the Supabase GRANTs are applied.
      - key: CREDITS_ENABLED
        value: "false"
