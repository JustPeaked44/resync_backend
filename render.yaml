services:
  - type: web
    name: resync-backend
    env: docker
    dockerfilePath: ./Dockerfile
    # Render's 100s proxy timeout is handled at the application layer:
    # POST /api/scans/start + GET /api/scans/{id} polling (see main.py).
    envVars:
      - key: PORT
        value: "8000"
      - key: GEMINI_API_KEY
        sync: false
